<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel Bag</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffeaf2, #f5bfd2, #eaa2bd);
  color: #842d53;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.welcome {
  width: 100%;
  max-width: 900px;
  min-height: 500px;
  background: rgba(255,255,255,0.68);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 30px;
  box-shadow: 0 15px 45px rgba(130,45,83,0.15);
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  gap: 20px;
  padding: 35px;
}

.luggage-area {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.suitcase {
  position: relative;
  width: 210px;
  height: 300px;
}

.handle {
  position: absolute;
  top: 0;
  left: 78px;
  width: 55px;
  height: 75px;
  border: 10px solid #b95a80;
  border-bottom: none;
  border-radius: 15px 15px 0 0;
}

.bag {
  position: absolute;
  top: 65px;
  left: 12px;
  width: 185px;
  height: 205px;
  border: 5px solid #b95a80;
  border-radius: 24px;
  background: linear-gradient(110deg, #f9b8d0, #e982ab);
  box-shadow: inset 8px 0 0 #ffffff30,
              8px 12px 18px #9c41632a;
}

.line {
  position: absolute;
  top: 12px;
  bottom: 12px;
  width: 5px;
  background: #d76f98;
  border-radius: 5px;
}

.line.one { left: 43px; }
.line.two { left: 86px; }
.line.three { left: 129px; }

.heart {
  position: absolute;
  top: 72px;
  left: 65px;
  z-index: 2;
  color: white;
  font-size: 43px;
}

.wheel {
  position: absolute;
  top: 265px;
  width: 30px;
  height: 30px;
  border: 5px solid #a64b70;
  border-radius: 50%;
  background: #fff0f5;
}

.wheel.left { left: 30px; }
.wheel.right { right: 30px; }

.content {
  flex: 1.2;
  text-align: center;
}

.travel-icon {
  font-size: 42px;
  margin-bottom: 12px;
}

h1 {
  font-size: clamp(27px, 4vw, 43px);
  line-height: 1.2;
  margin: 10px 0 18px;
}

p {
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.login {
  display: inline-block;
  background: #bd4776;
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
  padding: 16px 42px;
  border-radius: 35px;
  box-shadow: 0 8px 20px #bd477640;
  transition: 0.2s;
}

.login:hover {
  background: #96345c;
  transform: translateY(-2px);
}

.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #98667b;
}

@media (max-width: 600px) {
  .welcome {
    flex-direction: column;
    padding: 28px 18px;
    gap: 10px;
  }

  .luggage-area {
    min-height: 285px;
  }

  .content {
    padding-bottom: 10px;
  }
}
</style>
</head>

<body>
<main class="welcome">

  <div class="luggage-area">
    <div class="suitcase">
      <div class="handle"></div>
      <div class="bag">
        <div class="line one"></div>
        <div class="line two"></div>
        <div class="line three"></div>
      </div>
      <div class="heart">♡</div>
      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>
  </div>

  <div class="content">
    <div class="travel-icon">✈ ♡</div>
    <h1>Welcome to<br>Smart Travel Bag</h1>
    <p>Your Journey, Made Smarter!</p>

    <a class="login" href="dashboard.html">
      TAP  &nbsp; →
    </a>

    <div class="footer">SMART TRAVEL BAG © 2026</div>
  </div>

</main>
</body>
</html>
