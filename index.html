<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Smart Travel Bag</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #f3bfd2, #e8a4bf);
      color: #79334f;
    }

    .welcome {
      width: 100%;
      max-width: 460px;
      padding: 35px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid white;
      border-radius: 28px;
      box-shadow: 0 12px 35px #a44f7330;
    }

    .suitcase {
      width: 190px;
      height: 200px;
      margin: 0 auto 20px;
      position: relative;
    }

    .handle {
      position: absolute;
      top: 0;
      left: 77px;
      width: 36px;
      height: 43px;
      border: 7px solid #b94e78;
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
    }

    .case {
      position: absolute;
      top: 35px;
      left: 25px;
      width: 140px;
      height: 140px;
      border: 4px solid #b94e78;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffd8e7, #ed94b7);
      box-shadow: inset 0 0 0 7px #ffffff40;
    }

    .case::before,
    .case::after {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 5px;
      background: #d879a0;
    }

    .case::before {
      left: 35px;
    }

    .case::after {
      right: 35px;
    }

    .heart {
      position: absolute;
      top: 40px;
      left: 45px;
      z-index: 1;
      font-size: 43px;
    }

    .wheel {
      position: absolute;
      bottom: 0;
      width: 23px;
      height: 18px;
      border-radius: 5px 5px 9px 9px;
      background: #8d4261;
    }

    .wheel.left {
      left: 38px;
    }

    .wheel.right {
      right: 38px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.3;
      margin: 10px 0;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 15px 0 28px;
    }

    .login {
      display: inline-block;
      padding: 15px 48px;
      border-radius: 30px;
      background: #bd4776;
      color: white;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 1px;
      box-shadow: 0 5px 15px #bd477640;
    }

    .login:hover {
      background: #96345c;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #98667b;
    }
  </style>
</head>

<body>
  <main class="welcome">

    <div class="suitcase">
      <div class="handle"></div>
      <div class="case"></div>
      <div class="heart">♡</div>
      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>

    <h1>Welcome to<br>Smart Travel Bag</h1>

    <p>Your Journey, Made Smarter! 💗</p>

    <a class="login" href="dashboard.html">LOG IN →</a>

    <div class="footer">SMART TRAVEL BAG © 2026</div>

  </main>
</body>
</html>
